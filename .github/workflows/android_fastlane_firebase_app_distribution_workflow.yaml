name: Flutter Android Firebase Distribution

on:
  push:
    branches:
      - main

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Fastlane Gems
        working-directory: android
        run: bundle install

      - name: Build APK
        run: flutter build apk --release --flavor production --target lib/main_production.dart --no-tree-shake-icons

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.8
          bundler-cache: true       
          working-directory: android

      - name: Install Fastlane
        run: gem install fastlane

      - name: Deploy to Firebase
        run: |
          cd android
          bundle exec fastlane firebase_distribution
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}