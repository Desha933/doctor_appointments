name: Flutter Android Firebase Distribution WorkFlow

on:
  push:
    branches:
      - main

jobs:
  distribute_to_firebase:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.0' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - run: flutter pub get
      - name: Install Fastlane
        run: |
          cd android
          bundle install
      - name: Build APK
        run: flutter build apk --release --flavor production --target lib/main_production.dart --no-tree-shake-icons

      - name: Deploy to Firebase
        run: |
          cd android
          bundle exec fastlane firebase_distribution
        env:
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
        